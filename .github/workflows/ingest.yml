name: ingest
on:
  schedule: [{cron: "*/10 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: ingest, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: "https://hackwatch.info/"
      WATCH_BUDGET_S: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Lazarus ingest + analysis
        run: python pipeline/run.py
      - name: Exchange, hack and whale watch
        run: python pipeline/watch.py
      - name: Scenarios
        run: python pipeline/scenarios.py
      - name: Commit data
        run: |
          git config user.name "blackglass-bot"; git config user.email "actions@users.noreply.github.com"
          git add data feed.xml feed.json
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
