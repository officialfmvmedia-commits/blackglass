name: ingest
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: ingest, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python pipeline/run.py
        env: {SITE_URL: "https://officialfmvmedia-commits.github.io/blackglass/"}
      - run: |
          git config user.name "blackglass-bot"; git config user.email "actions@users.noreply.github.com"
          git add data feed.xml feed.json
          git diff --cached --quiet || (git commit -m "data: $(date -u +%FT%TZ)" && git pull --rebase && git push)
